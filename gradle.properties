
# Project-wide Gradle settings.

# 1. Limitation RAM & Garbage Collector
# -Xmx1024m : Limite la RAM de Gradle à 1 Go
# -XX:+UseSerialGC : Diminue la charge CPU
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# 2. Désactivation du démon permanent (Libère la RAM après build)
org.gradle.daemon=false

# 3. Désactivation du parallélisme
org.gradle.parallel=false

# 4. Restriction à 1 seul thread processeur
org.gradle.workers.max=1

# 5. Désactivation de la surveillance continue des fichiers (Économise le CPU)
org.gradle.vfs.watch-fs=false

# 6. Activation du cache de configuration
org.gradle.configuration-cache=true

# 7. Désactivation de la compilation incrémentale parallèle Kotlin
kotlin.incremental=false
kotlin.parallel.tasks.in.project=false
kotlin.code.style=official